name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION:      ap-south-1
  ECR_BACKEND_REPO: workforce/backend
  ECR_FRONTEND_REPO: workforce/frontend
  EC2_INSTANCE_ID:  i-02d0a397f1d03ccf6
  DEPLOY_SCRIPT:    /home/ubuntu/apps/WORKFORCE/scripts/deploy-ec2.sh

jobs:
  # ── Job 1: CI gate ─────────────────────────────────────────────────────────
  test:
    name: Typecheck & Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test — server
        run: npm run test:server -- --run
        env:
          NODE_ENV: test

      - name: Test — web
        run: npm run test:web -- --run

  # ── Job 2: Build & push images to ECR ───────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-24.04
    needs: test

    outputs:
      image-tag:        ${{ steps.tag.outputs.tag }}
      backend-image:    ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}
      frontend-image:   ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}
      aws-account-id:   ${{ steps.ecr-login.outputs.registry }}

    permissions:
      id-token: write   # OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ───────────────────────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       apps/server/Dockerfile
          push:       true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       apps/web/Dockerfile
          push:       true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 3: Deploy to EC2 via SSM ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04
    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Send deploy command via SSM
        id: ssm
        run: |
          BACKEND_IMAGE="${{ needs.build-and-push.outputs.backend-image }}"
          FRONTEND_IMAGE="${{ needs.build-and-push.outputs.frontend-image }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters "commands=[
              'BACKEND_IMAGE=${BACKEND_IMAGE} FRONTEND_IMAGE=${FRONTEND_IMAGE} IMAGE_TAG=${IMAGE_TAG} bash ${{ env.DEPLOY_SCRIPT }}'
            ]" \
            --timeout-seconds 600 \
            --output text \
            --query 'Command.CommandId')

          echo "command-id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: ${COMMAND_ID}"

      - name: Wait for SSM command to complete
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command-id }}"
          INSTANCE_ID="${{ env.EC2_INSTANCE_ID }}"

          echo "Waiting for SSM command ${COMMAND_ID}..."

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "  [${i}/60] Status: ${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: ${STATUS}"
              # Print command output for debugging
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query '[StandardOutputContent, StandardErrorContent]' \
                --output text
              exit 1
            fi

            sleep 10
          done

          echo "❌ Timed out waiting for SSM command"
          exit 1

      - name: Print SSM output (always)
        if: always()
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command-id }}"
          INSTANCE_ID="${{ env.EC2_INSTANCE_ID }}"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '[StandardOutputContent, StandardErrorContent]' \
            --output text 2>/dev/null || echo "(output not yet available)"
