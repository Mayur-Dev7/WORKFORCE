# HTTP → HTTPS redirect
server {
    listen 80;
    server_name workforce.duckdns.org;

    # Certbot webroot challenge support (avoids port 80 conflict during renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name workforce.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/workforce.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workforce.duckdns.org/privkey.pem;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Permissions for camera + geolocation (required for biometric features)
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    # ─── API proxy to backend ──────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass         http://backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20m;
    }

    # ─── React SPA ────────────────────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively, HTML never
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|bin|json)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── ML model files (large, cache long) ──────────────────────────────
    location /models/ {
        root    /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }
}
