# Production Docker Compose — images pulled from ECR by EC2
# Do NOT run docker compose build with this file.
# Image versions are controlled by .env.deploy

version: "3.8"

networks:
  workforce_access_network:
    name: workforce_access_network
    driver: bridge

volumes:
  workforce_access_postgres_data:
    name: workforce_access_postgres_data

services:
  # ── Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: workforce_access_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-workforce_access_db}
      POSTGRES_USER:     ${POSTGRES_USER:-workforce_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - workforce_access_postgres_data:/var/lib/postgresql/data
    networks:
      - workforce_access_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workforce_admin} -d ${POSTGRES_DB:-workforce_access_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL is NOT published outside Docker network

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: workforce_access_backend
    restart: unless-stopped
    env_file:
      - /home/ubuntu/apps/WORKFORCE/apps/server/.env
    environment:
      NODE_ENV:  production
      DB_HOST:   postgres
      DB_PORT:   "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workforce_access_network
    # Backend is NOT published outside Docker network

  # ── Frontend / Nginx ──────────────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    container_name: workforce_access_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount Let's Encrypt certificates read-only
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Mount certbot webroot challenge directory read-only
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - workforce_access_network

  # ── pgAdmin (optional — start manually when needed) ────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: workforce_access_pgadmin
    restart: "no"
    profiles:
      - admin
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL:-admin@workforce.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_HOST_PORT:-5051}:80"
    networks:
      - workforce_access_network
    depends_on:
      postgres:
        condition: service_healthy
